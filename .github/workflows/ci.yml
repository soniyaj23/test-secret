# This is a basic workflow to help you get started with MATLAB Actions

name: MATLAB Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # To start MSH in batch
    env:
      MW_START_MSH_IN_BATCH: 1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
      
      # Sets up MATLAB on a GitHub-hosted runner
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      # You can use "run-command" to execute custom MATLAB scripts, functions, or statements
      - name: Run personalValue script
        uses: matlab-actions/run-command@v3
        with:
          command: disp('Checking if InstallationValue of MATLAB settings persist in CICD!'); s = settings(); s.matlab.commandwindow.NumericFormat.InstallationValue = 'long'; personalValue;

      - name: Run script
        uses: matlab-actions/run-command@v3
        with:
          command: personalValue;
